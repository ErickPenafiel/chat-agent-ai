server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes y notas de voz viajan en base64 dentro del JSON (el backend rechaza más de 12 MB)
    client_max_body_size 13m;

    # Mismas rutas que el proxy de Vite (vite.config.ts)
    location ~ ^/(health|auth|channels|knowledge-blocks|prompts|connectors|evaluation) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
