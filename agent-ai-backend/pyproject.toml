[project]
name = "agente-ia-generico"
version = "0.1.0"
description = "Template genérico de agente de soporte/ventas por mensajería"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "E731", "B905", "B904"]  # líneas largas en español, imports tras sys.path, lambdas en tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "fastapi.File", "fastapi.Form"]
