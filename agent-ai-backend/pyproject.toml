[project]
name = "agente-ia-generico"
version = "0.1.0"
description = "Template genérico de agente de soporte/ventas por mensajería"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=0.2",
    "pydantic>=2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
